plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pulsopc.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.pulsopc.app'
        minSdk 23          // Android 6.0 Marshmallow
        targetSdk 34
        // GitHub compila la app en cada cambio y le pone un numero de version mayor
        // (-PcodigoVersion): asi PulsePC sabe si el movil tiene una version antigua.
        def codigo = project.findProperty('codigoVersion')
        versionCode Integer.parseInt((codigo ?: '8').toString())
        versionName codigo ? "${versionBase}.${codigo}" : versionBase
    }

    // Misma firma en todos los PCs y en GitHub: si no, Android no deja actualizar la app
    // encima de una compilada en otro sitio. Es una clave de depuracion, no secreta.
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Sin dependencias externas: solo APIs de Android, para que funcione igual en Android 6.

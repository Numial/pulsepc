<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PulsePC</title>
<!-- Pantalla para enviar a un Nest Hub (u otra pantalla Chromecast) o abrir en cualquier navegador.
     Dibuja el mismo diseno que el movil (paginas, widgets, tema). Las paginas se pasan solas,
     porque las paginas enviadas al Nest Hub no responden al tacto. -->
<!-- Tipografias equivalentes a las del sistema de Android (si no hay Internet, se usa la del navegador) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;900&family=Roboto+Condensed:wght@400;500&family=Roboto+Mono:wght@400;500&family=Noto+Serif:wght@400;600&family=Dancing+Script:wght@500;700&family=Coming+Soon&display=swap">
<style>
:root{--fondo:#0E1116;--tarjeta:#171B22;--tarjeta-bg:#171B22;--acento:#3EC7A0;--sec:#5B9BF0;--texto:#E6E6E6;--num:#E6E6E6;--fuente:"Roboto Condensed",Roboto,sans-serif;--peso:400;--pesoG:500}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--fondo);color:var(--texto);
  font-family:var(--fuente);font-weight:var(--peso)}
#raiz{position:absolute;inset:0;display:flex;flex-direction:column;padding:2vh 2vw;gap:1.6vh;transition:transform 2s}
#cab{display:flex;justify-content:space-between;align-items:baseline;font-size:3.2vh;opacity:.75}
#cab b{font-weight:500}
#rejilla{flex:1;display:grid;gap:1.6vh;min-height:0}
.w{background:var(--tarjeta-bg);border-radius:2vh;padding:1.8vh 1.6vw;display:flex;flex-direction:column;
  min-width:0;min-height:0;overflow:hidden;border:.4vh solid transparent}
.w.alerta{animation:parpadeo 1s infinite}
@keyframes parpadeo{50%{border-color:#E5484D;background:#3a1517}}
.c{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.t{font-size:2.6vh;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:.6vh}
.g{color:var(--num);font-size:7vh;font-weight:var(--pesoG);line-height:1.05;white-space:nowrap}
.g small{font-size:.45em;opacity:.7;font-weight:400}
.s{font-size:2.6vh;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{height:1.2vh;background:rgba(255,255,255,.08);border-radius:1vh;overflow:hidden;margin:.8vh 0}
.b i{display:block;height:100%;background:var(--acento);border-radius:1vh;transition:width .8s}
.l{display:flex;justify-content:space-between;gap:1vw;font-size:2.6vh;line-height:1.5}
.l span:first-child{opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l span:last-child{white-space:nowrap;color:var(--num)}
.cores{flex:1;display:flex;align-items:flex-end;gap:.3vw;min-height:0}
.cores i{flex:1;background:var(--acento);border-radius:.5vh .5vh 0 0;min-height:2px;transition:height .8s}
.med{display:flex;gap:1.5vw;align-items:center;flex:1;min-height:0}
.med img{height:100%;max-height:22vh;aspect-ratio:1;object-fit:cover;border-radius:1.2vh}
.med .g{color:var(--texto);font-size:4vh;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
canvas{flex:1;width:100%;min-height:0}
.w.img{padding:0;position:relative}
.w.img .c{position:absolute;inset:0}
.w.img .c img{width:100%;height:100%;display:block}
.w.img .t{position:absolute;left:1.6vw;bottom:1.2vh;z-index:1;opacity:1;text-shadow:0 1px 4px #000;margin:0}
.reloj{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center}
.reloj .g{font-size:12vh}
#puntos{position:absolute;bottom:1vh;left:0;right:0;text-align:center;font-size:2vh;opacity:.5;letter-spacing:.6vw}
#espera{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:4vh;opacity:.5}
</style></head><body>
<div id="raiz"><div id="cab"><b id="equipo">PulsePC</b><span id="hora"></span></div><div id="rejilla"></div></div>
<div id="puntos"></div><div id="espera"></div>
<script>
var IMGS={},EN=false;
function L(es,en){return EN?en:es}
function LOC(){return EN?"en-GB":"es-ES"}
var S=null,D=null,pag=0,cambio=Date.now(),hist={},HMAX=60,ultOK=0,versionD=null;
function e(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function n(x,d){return x==null||isNaN(x)?"–":Number(x).toFixed(d||0)}
function bar(p,c){return '<div class="b"><i style="width:'+Math.max(0,Math.min(100,p||0))+'%'+(c?';background:'+c:'')+'"></i></div>'}
function vel(k){return k==null?"–":k>=1024?n(k/1024,1)+" MB/s":n(k)+" KB/s"}
function li(a,b){return '<div class="l"><span>'+e(a)+'</span><span>'+e(b)+'</span></div>'}
function gpu0(){return (S.gpu&&S.gpu[0])||null}
function valor(m){
  if(m=="cpu")return S.cpu&&S.cpu.uso; if(m=="ram")return S.ram&&S.ram.porcentaje;
  if(m=="gpu"){var g=gpu0();return g&&g.uso} if(m=="temp_cpu")return S.cpu&&S.cpu.temp;
  if(m=="temp_gpu"){var g2=gpu0();return g2&&g2.temp} if(m=="red")return S.red&&(S.red.bajada_kbs+S.red.subida_kbs);
}
var NOMBRE_M={cpu:"CPU",gpu:"GPU",ram:"Memoria",temp_cpu:"Temperatura CPU",temp_gpu:"Temperatura GPU",red:"Red"};
var NOMBRE_M_EN={cpu:"CPU",gpu:"GPU",ram:"Memory",temp_cpu:"CPU temperature",temp_gpu:"GPU temperature",red:"Network"};
function guardarHist(){for(var m in NOMBRE_M){var v=valor(m);if(v==null)continue;(hist[m]=hist[m]||[]).push(v);if(hist[m].length>HMAX)hist[m].shift()}}

var W={
 cpu:function(){var c=S.cpu||{};return{t:"CPU",a:c.temp>=D.alerta_temp,h:'<div class="g">'+n(c.uso)+'<small> %</small></div>'+bar(c.uso)+
   '<div class="s">'+(c.temp!=null?n(c.temp)+' °C · ':'')+(c.freq_mhz?n(c.freq_mhz/1000,2)+' GHz':'')+(c.consumo_w!=null?' · '+n(c.consumo_w)+' W':'')+'</div>'}},
 ram:function(){var r=S.ram||{};return{t:L("Memoria","Memory"),h:'<div class="g">'+n(r.porcentaje)+'<small> %</small></div>'+bar(r.porcentaje,"var(--sec)")+
   '<div class="s">'+n(r.usada_gb,1)+' / '+n(r.total_gb,1)+' GB</div>'}},
 gpu:function(){var g=gpu0();if(!g)return{t:"GPU",h:'<div class="s">'+L("Sin GPU NVIDIA","No NVIDIA GPU")+'</div>'};
   return{t:g.nombre||"GPU",a:g.temp>=D.alerta_temp,h:'<div class="g">'+n(g.uso)+'<small> %</small></div>'+bar(g.uso)+
   '<div class="s">'+n(g.temp)+' °C · '+n(g.vram_usada_mb/1024,1)+' / '+n(g.vram_total_mb/1024,1)+' GB</div>'}},
 gpu_detalle:function(){var g=gpu0();if(!g)return{t:"GPU",h:'<div class="s">'+L("Sin GPU NVIDIA","No NVIDIA GPU")+'</div>'};
   return{t:(g.nombre||"GPU")+L(" · detalle"," · detail"),a:g.temp>=D.alerta_temp,h:li(L("Núcleo","Core"),n(g.reloj_mhz)+" MHz")+li(L("Memoria","Memory"),n(g.reloj_mem_mhz)+" MHz")+
   li(L("Consumo","Power"),n(g.consumo_w)+" / "+n(g.limite_w)+" W")+li(L("Ventilador","Fan"),n(g.ventilador)+" %")+li(L("Temperatura","Temperature"),n(g.temp)+" °C")}},
 temps:function(){var h="",t=S.temperaturas||[];for(var i=0;i<t.length&&i<8;i++)h+=li(t[i].sensor==t[i].dispositivo?t[i].sensor:t[i].dispositivo+" · "+t[i].sensor,n(t[i].valor)+" °C");
   return{t:L("Temperaturas","Temperatures"),h:h||'<div class="s">'+L("Sin sensores","No sensors")+'</div>'}},
 red:function(){var r=S.red||{};return{t:L("Red","Network"),h:'<div class="g" style="font-size:5vh">↓ '+vel(r.bajada_kbs)+'</div><div class="g" style="font-size:5vh;color:var(--sec)">↑ '+vel(r.subida_kbs)+'</div>'}},
 disco:function(){var d=S.disco||{},h=li(L("Lectura","Read"),vel(d.lectura_kbs))+li(L("Escritura","Write"),vel(d.escritura_kbs)),u=d.unidades||[];
   for(var i=0;i<u.length&&i<3;i++)h+=li(u[i].unidad,n(u[i].usado_gb)+" / "+n(u[i].total_gb)+" GB")+bar(u[i].porcentaje,"var(--sec)");return{t:L("Discos","Disks"),h:h}},
 nucleos:function(){var c=(S.cpu&&S.cpu.nucleos)||[],h="";for(var i=0;i<c.length;i++)h+='<i style="height:'+Math.max(1,c[i])+'%"></i>';
   return{t:L("Núcleos (","Cores (")+c.length+")",h:'<div class="cores">'+h+'</div>'}},
 ventiladores:function(){var h="",f=S.ventiladores||[],p=S.consumos||[];for(var i=0;i<f.length&&i<5;i++)h+=li(f[i].sensor,n(f[i].rpm)+" rpm");
   for(var j=0;j<p.length&&j<4;j++)h+=li(p[j].dispositivo+" · "+p[j].sensor,n(p[j].w)+" W");return{t:L("Ventiladores y consumo","Fans and power"),h:h||'<div class="s">'+L("Sin datos","No data")+'</div>'}},
 reloj:function(){var d=new Date();return{t:"",h:'<div class="reloj"><div class="g">'+d.toLocaleTimeString(LOC(),{hour:"2-digit",minute:"2-digit"})+'</div><div class="s">'+
   d.toLocaleDateString(LOC(),{weekday:"long",day:"numeric",month:"long"})+'</div></div>'}},
 procesos:function(){var p=S.procesos||[],h="";for(var i=0;i<p.length&&i<7;i++)h+=li(p[i].nombre,n(p[i].cpu)+" %");return{t:L("Procesos","Processes"),h:h||'<div class="s">–</div>'}},
 bateria:function(){var b=S.bateria;if(!b)return{t:L("Batería","Battery"),h:'<div class="s">'+L("Sin batería","No battery")+'</div>'};
   return{t:L("Batería","Battery"),h:'<div class="g">'+n(b.porcentaje)+'<small> %</small></div>'+bar(b.porcentaje)+'<div class="s">'+(b.cargando?L("Cargando","Charging"):b.minutos?Math.floor(b.minutos/60)+" h "+(b.minutos%60)+" min":"")+'</div>'}},
 multimedia:function(){var m=S.medios||{};if(!m.titulo)return{t:"Multimedia",h:'<div class="s">'+L("No suena nada","Nothing playing")+'</div>'};
   return{t:L("Suena ahora","Now playing")+(m.app?" · "+m.app:""),h:'<div class="med">'+(m.portada_id?'<span class="ph" data-src="/portada?id='+encodeURIComponent(m.portada_id)+'"></span>':'')+
   '<div style="min-width:0"><div class="g">'+e(m.titulo)+'</div><div class="s">'+e(m.artista||"")+(m.estado=="pausa"?L(" · en pausa"," · paused"):"")+'</div></div></div>'}},
 imagen:function(w){if(!w.imagen)return{t:L("Imagen","Image"),h:'<div class="s">'+L("Elige una foto o un GIF en el editor","Choose a photo or GIF in the editor")+'</div>'};
   return{t:"",img:1,h:'<span class="ph" data-src="/imagen?id='+encodeURIComponent(w.imagen)+'" data-ajuste="'+(w.ajuste=="contener"?"contain":"cover")+'"></span>'}},
 grafica:function(w){var m=w.metrica||"cpu",v=valor(m);return{t:(EN?NOMBRE_M_EN:NOMBRE_M)[m],a:(m=="temp_cpu"||m=="temp_gpu")&&v>=D.alerta_temp,graf:m,
   h:'<div class="g" style="font-size:4.5vh">'+(m=="red"?vel(v):n(v)+(m.indexOf("temp")==0?" °C":" %"))+'</div><canvas></canvas>'}}
};

function pintarGrafica(cv,m){var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;
  var x=cv.getContext("2d"),h=hist[m]||[];if(h.length<2)return;var max=m=="red"?Math.max.apply(null,h.concat([100])):100;
  var col=getComputedStyle(document.documentElement).getPropertyValue("--acento");x.beginPath();
  for(var i=0;i<h.length;i++){var px=cv.width*i/(HMAX-1),py=cv.height*(1-h[i]/max);i?x.lineTo(px,py):x.moveTo(px,py)}
  x.strokeStyle=col;x.lineWidth=3*dpr;x.stroke();x.lineTo(cv.width*(h.length-1)/(HMAX-1),cv.height);x.lineTo(0,cv.height);x.closePath();
  x.globalAlpha=.18;x.fillStyle=col;x.fill()}

// Coloca los widgets igual que el movil y el editor: en orden, en el primer hueco donde quepan.
function colocar(p){var ocup=[],out=[];for(var y=0;y<p.filas;y++){ocup.push([]);for(var x=0;x<p.columnas;x++)ocup[y].push(false)}
  for(var i=0;i<p.widgets.length;i++){var w=p.widgets[i],an=Math.min(w.ancho,p.columnas),al=Math.min(w.alto,p.filas),hecho=null;
    for(var f=0;f<=p.filas-al&&!hecho;f++)for(var c=0;c<=p.columnas-an&&!hecho;c++){var ok=true;
      for(var yy=f;yy<f+al&&ok;yy++)for(var xx=c;xx<c+an;xx++)if(ocup[yy][xx]){ok=false;break}
      if(ok){hecho={f:f,c:c};for(yy=f;yy<f+al;yy++)for(xx=c;xx<c+an;xx++)ocup[yy][xx]=true}}
    out.push(hecho?{i:i,f:hecho.f,c:hecho.c,an:an,al:al}:{i:i,f:-1})}return out}
function pintar(){
  if(!S||!D)return;var ps=D.paginas||[];if(!ps.length)return;
  var fija=D.pagina_fija!=null?D.pagina_fija:-1;
  if(fija>=0&&fija<ps.length)pag=fija;
  else if(ps.length>1&&Date.now()-cambio>(D.segundos||15)*1000){pag=(pag+1)%ps.length;cambio=Date.now()}
  if(pag>=ps.length)pag=0;var p=ps[pag],rj=document.getElementById("rejilla");
  rj.style.gridTemplateColumns="repeat("+p.columnas+",minmax(0,1fr))";rj.style.gridTemplateRows="repeat("+p.filas+",minmax(0,1fr))";
  var h="",grafs=[];
  var pos=colocar(p),k2=0;
  for(var q=0;q<pos.length;q++){var o=pos[q];if(o.f<0)continue;var w=p.widgets[o.i],f=W[w.tipo];if(!f)continue;var r;try{r=f(w)}catch(err){r={t:w.tipo,h:""}}
    if(r.graf)grafs.push([k2,r.graf]);k2++;
    h+='<div class="w'+(r.a?' alerta':'')+(r.img?' img':'')+'" style="grid-column:'+(o.c+1)+' / span '+o.an+';grid-row:'+(o.f+1)+' / span '+o.al+'">'+
       ((w.titulo||r.t)?'<div class="t">'+e(w.titulo||r.t)+'</div>':'')+'<div class="c">'+r.h+'</div></div>'}
  // Solo se rehace la rejilla si ha cambiado algo; asi el Nest Hub trabaja mucho menos.
  if(h!==ultH){ultH=h;rj.innerHTML=h;
  // Las imagenes (fotos, GIF, portada) no se vuelven a crear cada segundo: se reutiliza el
  // mismo elemento para que no parpadeen ni se reinicie el GIF.
  var phs=rj.querySelectorAll(".ph");
  for(var z=0;z<phs.length;z++){var src=phs[z].getAttribute("data-src"),im=IMGS[src];
    if(!im){im=IMGS[src]=new Image();im.src=src}
    im.style.objectFit=phs[z].getAttribute("data-ajuste")||"cover";phs[z].parentNode.replaceChild(im,phs[z])}}
  for(var j=0;j<grafs.length;j++)pintarGrafica(rj.children[grafs[j][0]].querySelector("canvas"),grafs[j][1]);
  document.getElementById("cab").style.display=D.cabecera?"flex":"none";
  document.getElementById("equipo").textContent=S.equipo||"PulsePC";
  document.getElementById("hora").textContent=new Date().toLocaleTimeString(LOC(),{hour:"2-digit",minute:"2-digit"});
  var pt="";for(var k=0;k<ps.length&&ps.length>1&&!(fija>=0);k++)pt+=k==pag?"●":"○";document.getElementById("puntos").textContent=pt;
}
function aplicarTema(){if(!D||D.version===versionD)return;versionD=D.version;var t=D.tema||{},s=document.documentElement.style;
  s.setProperty("--fondo",t.fondo);s.setProperty("--tarjeta",t.tarjeta);s.setProperty("--acento",t.acento);s.setProperty("--sec",t.secundario);s.setProperty("--texto",t.texto);
  s.setProperty("--num",t.numeros||t.texto);
  var f=FUENTES[D.fuente]||FUENTES.condensada;s.setProperty("--fuente",f[0]);s.setProperty("--peso",f[1]);s.setProperty("--pesoG",f[2]);
  var dir={vertical:"180deg",horizontal:"90deg",diagonal:"135deg"}[D.degradado];
  s.setProperty("--tarjeta-bg",dir?"linear-gradient("+dir+","+t.tarjeta+","+(t.tarjeta2||t.tarjeta)+")":t.tarjeta)}
// Mismas tipografias que el movil: [familia, peso del texto, peso de los numeros]
var FUENTES={condensada:['"Roboto Condensed",Roboto,sans-serif',400,500],moderna:['Roboto,sans-serif',400,500],
  fina:['Roboto,sans-serif',300,300],gruesa:['Roboto,sans-serif',500,900],serif:['"Noto Serif",Georgia,serif',400,600],
  mono:['"Roboto Mono",Consolas,monospace',400,500],manuscrita:['"Dancing Script",cursive',500,700],informal:['"Coming Soon",cursive',400,400]};
var PV=null,ultH="",INICIO=Date.now();
// Se piden los datos cada 2 s, sin solapar peticiones (antes era cada segundo).
function pedir(){var r=new XMLHttpRequest(),sig=function(){setTimeout(pedir,2000)};r.onerror=r.ontimeout=sig;r.open("GET","/stats?pantalla=1");r.timeout=4000;
  r.onload=function(){try{var s=JSON.parse(r.responseText);
    // PulsePC actualizado: la pagina se recarga para no seguir con el codigo antiguo.
    if(s.pagina_v){if(PV===null)PV=s.pagina_v;else if(s.pagina_v!==PV){location.reload();return}}
    // Cada 2 h se recarga la pagina para liberar memoria del Nest Hub.
    if(Date.now()-INICIO>7200000){location.reload();return}
    if(s.idioma)EN=s.idioma=="en";document.documentElement.lang=EN?"en":"es";
    document.getElementById("espera").textContent=L("PulsePC · esperando al PC…","PulsePC · waiting for the PC…");
    if(!s.cpu)return;S=s;D=s.diseno||D;ultOK=Date.now();aplicarTema();guardarHist();pintar()}catch(x){}finally{sig()}};r.send()}
document.getElementById("espera").textContent=L("PulsePC · esperando al PC…","PulsePC · waiting for the PC…");
pedir();
// Sin datos 30 s: se oscurece y avisa. Anti-quemado: se mueve un poco cada minuto.
setInterval(function(){var sin=Date.now()-ultOK>30000;document.getElementById("espera").style.display=sin?"flex":"none";
  document.getElementById("raiz").style.opacity=sin?0:1},2000);
setInterval(function(){document.getElementById("raiz").style.transform="translate("+(Math.round(Math.random()*6)-3)+"px,"+(Math.round(Math.random()*6)-3)+"px)"},60000);
</script></body></html>
